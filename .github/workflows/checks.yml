name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_graphs.mjs
      - run: node tests/test_presence.mjs
      - run: python tools/check_public_tree.py .
